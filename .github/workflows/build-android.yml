name: Build Android APK

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "android/**"
      - "www/**"
      - "src/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into the Android project
        run: |
          npm run build:mobile-init
          # Stamp versi (SHA commit) ke salinan www/ yang dibekukan di dalam
          # APK, supaya aplikasi bisa membandingkan dirinya dengan
          # version.json live di GitHub Pages dan memperingatkan pemakai
          # kalau APK-nya sudah usang.
          SHA7="${GITHUB_SHA::7}"
          printf '{"version":"%s"}\n' "$SHA7" > www/version.json
          sed -i "s/window.__APP_VERSION__ || \"dev\"/window.__APP_VERSION__ || \"$SHA7\"/" www/app.js
          npx cap sync android

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
